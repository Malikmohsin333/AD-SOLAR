name: solar_agreement
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # PDF Generation & Printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # Date & Time Formatting
  intl: ^0.19.0

  # Google Fonts
  google_fonts: ^6.2.1

  # File system paths
  path_provider: ^2.1.2

  # International phone number field
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App icon generation
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/logo.png